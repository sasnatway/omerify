name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet yt-dlp

      - name: Create Flet App Bootstrap
        run: |
          flet create temp_app
          cp main.py temp_app/
          if [ -f logo.png ]; then cp logo.png temp_app/; fi

      - name: Build APK via Flutter
        run: |
          cd temp_app
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omerify-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk